<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tanding.in - Manajemen Turnamen E-Sports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-brand">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/">Tanding<span class="text-accent">.in</span></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div id="navUser" class="d-flex align-items-center gap-2 text-white"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app"></main>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog"><form class="modal-content" id="modalForm">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="submit" class="btn btn-brand" id="modalOk">Simpan</button>
      </div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
